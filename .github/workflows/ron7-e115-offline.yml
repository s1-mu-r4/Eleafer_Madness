name: Ron7 E115 offline ARM audit
on:
  push:
    branches:
      - research/ron7-e115-preflash
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
    steps:
      - name: Install Debian ARM toolchain
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git make build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3 python3-venv python3-pip
      - name: Checkout Eleafer audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reproduce pinned Ron7 patched ARM build and offline tests
        run: bash tests/offline/run_patched_build_ci.sh
